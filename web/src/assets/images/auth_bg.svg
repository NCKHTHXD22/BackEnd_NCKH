      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
