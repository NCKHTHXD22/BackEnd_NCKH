<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer circle - dark blue -->
  <circle cx="50" cy="50" r="48" fill="#1a3a5c" stroke="#4a9eff" stroke-width="2"/>
  
  <!-- Water wave background -->
  <path d="M10 60 Q25 50, 40 58 T70 55 T95 60 L95 85 Q75 95, 50 95 Q25 95, 5 85 Z" fill="#1e88e5" opacity="0.5"/>
  <path d="M5 65 Q20 55, 35 63 T65 60 T95 65 L95 85 Q75 95, 50 95 Q25 95, 5 85 Z" fill="#2196f3" opacity="0.7"/>
  <path d="M5 70 Q20 62, 35 68 T65 65 T95 70 L95 85 Q75 95, 50 95 Q25 95, 5 85 Z" fill="#42a5f5" opacity="0.8"/>
  
  <!-- Shield / DSS symbol -->
  <path d="M50 18 L70 30 L70 52 Q70 65, 50 75 Q30 65, 30 52 L30 30 Z" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  
  <!-- Inner shield highlight -->
  <path d="M50 24 L65 33 L65 50 Q65 61, 50 69 Q35 61, 35 50 L35 33 Z" fill="#1e88e5"/>
  
  <!-- Chart/data lines inside shield -->
  <line x1="40" y1="55" x2="40" y2="42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="55" x2="47" y2="36" stroke="#ffb74d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="55" x2="54" y2="45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="61" y1="55" x2="61" y2="38" stroke="#ffb74d" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Warning triangle accent -->
  <path d="M72 20 L80 34 L64 34 Z" fill="#ff9800" stroke="#fff" stroke-width="1"/>
  <text x="72" y="32" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">!</text>
</svg>
